# ==============================================================
# Proyecto Construcción 1 — Arquitectura de 3 capas en Docker
#
#   FRONT (Flask, :8000)
#      │ elige a cuál API llamar
#      ├── API GENÉRICA  (FastAPI, :8001) — CRUD sobre cualquier tabla
#      └── API FACTURAS  (FastAPI, :8002) — CRUD por entidad (12 tablas)
#   API GENÉRICA C# (ASP.NET Core, :8003) — mismo CRUD genérico + JWT
#              │ todas eligen motor con DB_PROVIDER
#              └── PostgreSQL | MariaDB | SQL Server (bdfacturas)
#
# Uso: docker compose up -d --build
# Cambiar de motor:  DB_PROVIDER=mariadb docker compose up -d
#                    (opciones: postgres | mariadb | sqlserver)
# ==============================================================
services:

  # --- CAPA 1: FRONT — Flask (interfaz web para el usuario) ---
  front:
    build: ./front_flask
    volumes:
      - ./front_flask:/app         # el código se monta para que los cambios se vean al instante
      - .:/workspace:cached        # todo el repo (lo usa el devcontainer opcional de VS Code)
    command: flask --app app run --host 0.0.0.0 --port 8000 --debug
    restart: unless-stopped
    ports:
      - "8000:8000"                # http://localhost:8000
    environment:
      # URLs internas de las APIs (entre contenedores se usa el nombre del servicio)
      API_GENERICA_URL: http://api-generica:8001
      API_FACTURAS_URL: http://api-facturas:8002

  # --- CAPA 2a: API GENÉRICA — CRUD sobre cualquier tabla ---
  api-generica:
    build: ./api_generica
    volumes:
      - ./api_generica:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8001 --reload
    restart: unless-stopped
    ports:
      - "8001:8001"                # http://localhost:8001/swagger
    environment:
      DB_PROVIDER: ${DB_PROVIDER:-postgres}
      DB_POSTGRES: postgresql+asyncpg://paradigmas:paradigmas123@postgres:5432/bdfacturas_postgres_local
      DB_MARIADB: mysql+aiomysql://paradigmas:paradigmas123@mariadb:3306/bdfacturas_mariadb_local
      DB_MYSQL: mysql+aiomysql://paradigmas:paradigmas123@mariadb:3306/bdfacturas_mariadb_local
      DB_SQLSERVER: mssql+aioodbc://sa:Paradigmas123!@sqlserver:1433/bdfacturas_sqlserver_local?driver=ODBC+Driver+18+for+SQL+Server&TrustServerCertificate=yes

  # --- CAPA 2b: API FACTURAS — CRUD por entidad con validación Pydantic ---
  api-facturas:
    build: ./api_facturas
    volumes:
      - ./api_facturas:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8002 --reload
    restart: unless-stopped
    ports:
      - "8002:8002"                # http://localhost:8002/swagger
    environment:
      DB_PROVIDER: ${DB_PROVIDER:-postgres}
      DB_POSTGRES: postgresql+asyncpg://paradigmas:paradigmas123@postgres:5432/bdfacturas_postgres_local
      DB_MARIADB: mysql+aiomysql://paradigmas:paradigmas123@mariadb:3306/bdfacturas_mariadb_local
      DB_MYSQL: mysql+aiomysql://paradigmas:paradigmas123@mariadb:3306/bdfacturas_mariadb_local
      DB_SQLSERVER: mssql+aioodbc://sa:Paradigmas123!@sqlserver:1433/bdfacturas_sqlserver_local?driver=ODBC+Driver+18+for+SQL+Server&TrustServerCertificate=yes

  # --- CAPA 2c: API GENÉRICA C# — mismo CRUD genérico en ASP.NET Core + JWT ---
  api-generica-csharp:
    build: ./api_generica_csharp
    volumes:
      - ./api_generica_csharp:/app   # el código se monta: dotnet watch recompila al guardar
      - /app/bin                     # bin y obj quedan DENTRO del contenedor (Linux),
      - /app/obj                     #   sin mezclarse con los compilados de Windows
    restart: unless-stopped
    ports:
      - "8003:8003"                  # http://localhost:8003/swagger
    environment:
      # Misma variable DB_PROVIDER que las APIs Python (postgres | mariadb | sqlserver).
      # ASP.NET Core lee "ConnectionStrings__X" como ConnectionStrings:X y
      # estas variables SOBREESCRIBEN los valores de appsettings.json.
      DatabaseProvider: ${DB_PROVIDER:-postgres}
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=bdfacturas_postgres_local;Username=paradigmas;Password=paradigmas123;Pooling=true;Maximum Pool Size=100;"
      ConnectionStrings__MariaDB: "Server=mariadb;Port=3306;Database=bdfacturas_mariadb_local;Uid=paradigmas;Pwd=paradigmas123;Allow User Variables=true;CharSet=utf8mb4;"
      ConnectionStrings__SqlServer: "Server=sqlserver,1433;Database=bdfacturas_sqlserver_local;User Id=sa;Password=Paradigmas123!;TrustServerCertificate=True;"

  # --- PostgreSQL 16 ---
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bdfacturas_postgres_local
      POSTGRES_USER: paradigmas
      POSTGRES_PASSWORD: paradigmas123
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "15432:5432"     # puerto en el host (para DBeaver/pgAdmin opcional)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paradigmas -d bdfacturas_postgres_local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- MariaDB 11 ---
  mariadb:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: paradigmas123
      MARIADB_DATABASE: bdfacturas_mariadb_local
      MARIADB_USER: paradigmas
      MARIADB_PASSWORD: paradigmas123
    volumes:
      - mariadbdata:/var/lib/mysql
      - ./db/mariadb/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "13306:3306"     # puerto en el host (para HeidiSQL/DBeaver opcional)
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- phpMyAdmin (administrador web de MariaDB) ---
  phpmyadmin:
    image: phpmyadmin:latest
    environment:
      PMA_HOST: mariadb
      PMA_USER: paradigmas
      PMA_PASSWORD: paradigmas123
    ports:
      - "8081:80"        # http://localhost:8081
    depends_on:
      - mariadb

  # --- SQL Server 2022 (requiere ~2 GB de RAM) ---
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Paradigmas123!"
      MSSQL_PID: Developer
    volumes:
      - mssqldata:/var/opt/mssql
    ports:
      - "11433:1433"     # puerto en el host (para SSMS/Azure Data Studio opcional)
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s

  # --- Inicializador de SQL Server (crea la BD la primera vez y termina) ---
  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: "Paradigmas123!"
    volumes:
      - ./db/sqlserver:/scripts:ro
    entrypoint: ["/bin/bash", "/scripts/init.sh"]
    restart: "no"

volumes:
  pgdata:
  mariadbdata:
  mssqldata:
